
name: Deploy Nang Hoa PWA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Build Nàng Hoa POS
        working-directory: frontend
        run: npm run build

      - name: Verify production build
        run: |
          echo "=== DIST CONTENTS ==="
          ls -lah frontend/dist
          echo "=== INDEX.HTML ==="
          test -f frontend/dist/index.html
          sed -n '1,60p' frontend/dist/index.html
          echo "=== ASSETS ==="
          find frontend/dist -maxdepth 2 -type f | head -40

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
